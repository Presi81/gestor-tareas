<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Gestor de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>📝 President_evil</h1>
    <p>Ejercicio de gestor de tareas para el máster de programación con IA</p>
  </header>

  <main>
    <section class="add-task">
      <input type="text" id="taskInput" placeholder="Escribe una tarea...">
      <select id="priorityInput">
        <option value="baja">Baja</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
      </select>
      <button id="addButton">Añadir</button>
      <button id="loadExampleBtn">Cargar ejemplos</button>
    </section>

    <input type="text" id="searchInput" placeholder="🔍 Buscar tarea...">

    <div id="loadingIndicator" style="display: none; text-align: center; margin: 10px; color: #6366f1; font-weight: bold;">
      ⏳ Conectando con el servidor...
    </div>

    <p id="taskCounter">Tareas pendientes: 0</p>

    <div class="filters">
      <button data-filter="all" class="active">Todas</button>
      <button data-filter="pending">Pendientes</button>
      <button data-filter="completed">Completadas</button>
      <div class="filters">
  <button id="reloadBtn" title="Recargar datos">🔄</button>
</div>

<div id="offlineAlert" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 2000;">
  ⚠️ Sin conexión a Internet
</div>
    </div>

    <section class="task-list">
      <h2>Tareas</h2>
      <ul id="taskList"></ul>
    </section>

    <button id="clearCompleted">Limpiar completadas</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
